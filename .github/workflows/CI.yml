name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - onnx_reader
    tags: 
      - '*'
env: 
  PYTHON: ''
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ matrix.version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - name: Print runner information
        run: | 
          echo "Runner name: ${{ runner.name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Runner Labels: ${{ runner.labels }}"
      - name: Set up CUDA
        if: contains(runner.labels, 'self-hosted') && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit
          sudo apt-get install -y nvidia-driver-470
      - name: Install local dependencies
        run: |
          rm -f Manifest.toml
          julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/samysweb/VNNLib.jl#extension"); Pkg.Registry.add("General")'
          julia --project=. -e 'using Pkg; Pkg.resolve(); Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - name: Upload lcov.info to codecov
        if: github.repository == 'intelligent-control-lab/ModelVerification.jl'
        uses: codecov/codecov-action@v1
        with:
          file: lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Upload coverage reports to Codecov
        if: github.repository == 'intelligent-control-lab/ModelVerification.jl'
        uses: codecov/codecov-action@v4.0.1
        env:
          token: ${{ secrets.CODECOV_TOKEN }}

